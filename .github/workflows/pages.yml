name: Deploy the homepage to GitHub Pages

# The notes repository triggers workflow_dispatch after its own checks pass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.14.4 --activate

      - name: Checkout docks
        run: make docks-bootstrap

      - name: Set up direct LaTeX web export
        run: sh ../notes/notes/math/toolchain/scripts/setup_latex_web_ci.sh

      - name: Build the site
        run: |
          pnpm --dir site install --frozen-lockfile
          pnpm --dir site build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
